services:
  api:
    image: ghcr.io/${REPOSITORY_NAME}:latest
    restart: always
    environment:
      - API_BASE_URL
      - DATABASE_URL
      - TEST_DATABASE_URL
      - RESEND_API_KEY
      - ALLOWED_HOSTS
      - ALLOWED_ORIGINS
      - SENDER_EMAIL
      - JWT_SECRET_KEY
    ports:
      - "8000:8000"  
    networks:
      - api_network
      - db_network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network
    expose:
      - "5432"      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 

networks:
  api_network:    
  db_network:
    internal: true
